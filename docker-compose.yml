services:
  fiuba-db:
    image: postgres:18.4
    restart: no
    environment:
      POSTGRES_DB: juanshop_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"  
    volumes:
      - juanshop_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  juanshop_pgdata:
