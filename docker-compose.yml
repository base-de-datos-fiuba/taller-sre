services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bytemarket
      POSTGRES_USER: bytemarket_admin
      POSTGRES_PASSWORD: classroom_demo_only
    volumes:
      - bytemarket_pgdata:/var/lib/postgresql
      - ./database/init/000_initialize.sh:/docker-entrypoint-initdb.d/000_initialize.sh:ro
      - ./database/init/001_roles.sql:/bytemarket-init/001_roles.sql:ro
      - ./migrations:/bytemarket-init/migrations:ro
      - ./database/seed.sql:/bytemarket-init/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytemarket_admin -d bytemarket"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bytemarket
      DB_USER: bytemarket_app
      DB_PASSWORD: classroom_demo_only
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  bytemarket_pgdata:
